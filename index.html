<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Multi-Search</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
    input { padding: 10px; width: 300px; border-radius: 5px; border: none; }
    button { padding: 10px 20px; background: #e50914; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
    .card { background: #222; padding: 15px; border-radius: 8px; width: 220px; text-align: left; }
    .card img { width: 100%; border-radius: 5px; }
    .links a { display: block; margin-top: 8px; padding: 6px; background: #333; color: #00d4ff; text-decoration: none; border-radius: 4px; text-align: center; font-size: 14px; }
    .links a:hover { background: #444; }
  </style>
</head>
<body>

  <h1>Search Movies Across Sites</h1>
  <input type="text" id="searchInput" placeholder="Enter movie name (e.g. Batman)...">
  <button onclick="searchMovies()">Search</button>

  <div class="grid" id="results"></div>

  <script>
    // 1. Add the search URL patterns of the sites you want to link to here:
    const MY_SITES = [
      { name: "Site 1", searchUrl: "https://www.1shows.org/search?query=" },
      { name: "Site 2", searchUrl: "https://www.1tube.org/search?q=" },
      { name: "Site 3", searchUrl: "https://www.1flex.org/search?q=" }
    ];

    async function searchMovies() {
      const query = document.getElementById('searchInput').value.trim();
      const resultsDiv = document.getElementById('results');
      if (!query) return;

      resultsDiv.innerHTML = "<p>Searching...</p>";

      // Fetches official movie titles & posters using a free public API (iTunes Search API requires no API key!)
      const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=movie&limit=8`);
      const data = await response.json();

      resultsDiv.innerHTML = "";

      data.results.forEach(movie => {
        const poster = movie.artworkUrl100.replace('100x100', '400x400');
        const title = movie.trackName;

        // Build buttons for each of your backend sites
        let siteButtons = "";
        MY_SITES.forEach(site => {
          const fullUrl = site.searchUrl + encodeURIComponent(title);
          siteButtons += `<a href="${fullUrl}" target="_blank">Find on ${site.name}</a>`;
        });

        resultsDiv.innerHTML += `
          <div class="card">
            <img src="${poster}" alt="${title}">
            <h3>${title}</h3>
            <div class="links">${siteButtons}</div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
