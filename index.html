<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus // Streaming Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    /* 1. Purple Theme (Default) */
    :root,
    body[data-theme="purple"] {
      --bg-base: #070412;
      --bg-aura-1: rgba(168, 85, 247, 0.24);
      --bg-aura-2: rgba(217, 70, 239, 0.16);
      --bg-aura-3: rgba(129, 140, 248, 0.14);
      --card-bg: rgba(18, 12, 38, 0.58);
      --card-inner: rgba(14, 10, 30, 0.75);
      --card-hover: rgba(30, 20, 62, 0.9);
      --border: rgba(168, 85, 247, 0.2);
      --border-glow: rgba(168, 85, 247, 0.55);
      --accent-1: #c084fc;
      --accent-2: #a855f7;
      --accent-3: #e879f9;
      --glow: rgba(168, 85, 247, 0.34);
      --pill-bg: rgba(168, 85, 247, 0.15);
      --pill-border: rgba(168, 85, 247, 0.38);
      --text: #f8fafc;
      --muted: #a1a1aa;
    }

    /* 2. Green Theme (Emerald & Neon Mint) */
    body[data-theme="green"] {
      --bg-base: #030b07;
      --bg-aura-1: rgba(16, 185, 129, 0.22);
      --bg-aura-2: rgba(52, 211, 153, 0.16);
      --bg-aura-3: rgba(163, 230, 53, 0.12);
      --card-bg: rgba(6, 24, 16, 0.58);
      --card-inner: rgba(5, 19, 13, 0.76);
      --card-hover: rgba(10, 38, 26, 0.9);
      --border: rgba(16, 185, 129, 0.2);
      --border-glow: rgba(52, 211, 153, 0.55);
      --accent-1: #34d399;
      --accent-2: #10b981;
      --accent-3: #a3e635;
      --glow: rgba(16, 185, 129, 0.32);
      --pill-bg: rgba(16, 185, 129, 0.15);
      --pill-border: rgba(52, 211, 153, 0.38);
      --muted: #9ca3af;
    }

    /* 3. Red Theme (Crimson Ruby) */
    body[data-theme="red"] {
      --bg-base: #0c0305;
      --bg-aura-1: rgba(244, 63, 94, 0.24);
      --bg-aura-2: rgba(225, 29, 72, 0.18);
      --bg-aura-3: rgba(251, 113, 133, 0.12);
      --card-bg: rgba(30, 8, 14, 0.58);
      --card-inner: rgba(24, 6, 11, 0.76);
      --card-hover: rgba(46, 12, 22, 0.9);
      --border: rgba(244, 63, 94, 0.22);
      --border-glow: rgba(244, 63, 94, 0.55);
      --accent-1: #fb7185;
      --accent-2: #e11d48;
      --accent-3: #fda4af;
      --glow: rgba(244, 63, 94, 0.34);
      --pill-bg: rgba(244, 63, 94, 0.15);
      --pill-border: rgba(244, 63, 94, 0.38);
      --muted: #fda4af;
    }

    /* 4. Blue Theme (Electric Ocean & Cobalt) */
    body[data-theme="blue"] {
      --bg-base: #020712;
      --bg-aura-1: rgba(56, 189, 248, 0.24);
      --bg-aura-2: rgba(37, 99, 235, 0.20);
      --bg-aura-3: rgba(6, 182, 212, 0.15);
      --card-bg: rgba(8, 18, 38, 0.58);
      --card-inner: rgba(6, 14, 30, 0.76);
      --card-hover: rgba(12, 28, 58, 0.9);
      --border: rgba(56, 189, 248, 0.2);
      --border-glow: rgba(56, 189, 248, 0.55);
      --accent-1: #38bdf8;
      --accent-2: #2563eb;
      --accent-3: #22d3ee;
      --glow: rgba(56, 189, 248, 0.32);
      --pill-bg: rgba(56, 189, 248, 0.15);
      --pill-border: rgba(56, 189, 248, 0.38);
      --muted: #94a3b8;
    }

    /* 5. Gold Theme (Solar Amber & Honey Gold) */
    body[data-theme="gold"] {
      --bg-base: #0b0702;
      --bg-aura-1: rgba(245, 158, 11, 0.22);
      --bg-aura-2: rgba(234, 88, 12, 0.16);
      --bg-aura-3: rgba(250, 204, 21, 0.12);
      --card-bg: rgba(28, 18, 6, 0.58);
      --card-inner: rgba(22, 14, 5, 0.76);
      --card-hover: rgba(42, 26, 9, 0.9);
      --border: rgba(251, 191, 36, 0.22);
      --border-glow: rgba(251, 191, 36, 0.55);
      --accent-1: #fbbf24;
      --accent-2: #ea580c;
      --accent-3: #fde047;
      --glow: rgba(245, 158, 11, 0.32);
      --pill-bg: rgba(245, 158, 11, 0.15);
      --pill-border: rgba(251, 191, 36, 0.38);
      --muted: #d6d3d1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 6rem;
      transition: background-color 0.5s ease, color 0.3s ease;
    }

    /* Interactive 3D WebGL Background Canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      pointer-events: none;
    }

    /* Dynamic Theme Aura Mesh + Subtle Dot Matrix */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 12% 18%, var(--bg-aura-1), transparent 45%),
        radial-gradient(circle at 88% 78%, var(--bg-aura-2), transparent 45%),
        radial-gradient(circle at 50% 42%, var(--bg-aura-3), transparent 55%),
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 30px 30px;
      z-index: -1;
      pointer-events: none;
      transition: background-image 0.5s ease;
    }

    /* Adblock Notice */
    .adblock-notice {
      text-align: center;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      margin: 1.1rem auto 0.4rem;
      padding: 0.45rem 1.15rem;
      background: var(--card-bg);
      border: 1px solid var(--pill-border);
      border-radius: 999px;
      width: fit-content;
      max-width: 92vw;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 18px var(--glow);
    }
    .adblock-notice a {
      color: var(--accent-1);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 800;
      transition: color 0.2s ease;
    }
    .adblock-notice a:hover {
      color: var(--accent-3);
    }

    /* Top Utility Bar */
    .top-utility-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.85rem;
    }

    /* Brand Identity */
    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      box-shadow: 0 0 20px var(--glow);
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .utility-controls {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .country-tip-container {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.42rem 0.95rem;
      border-radius: 999px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .country-tip-container:hover {
      border-color: var(--pill-border);
      box-shadow: 0 8px 25px var(--glow);
    }

    .country-tip-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .country-select {
      background: transparent;
      border: none;
      color: var(--accent-1);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }
    .country-select option {
      background: #0c101c;
      color: var(--text);
    }

    /* Floating Transparent Header Container for Categories */
    .sticky-header {
      position: sticky;
      top: 0.6rem;
      z-index: 999;
      background: transparent !important;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-bottom: none;
      padding: 0.5rem 0;
      margin-bottom: 2rem;
      pointer-events: none;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      justify-content: center;
      pointer-events: auto;
    }

    /* Floating Glass Category Navigation Tabs */
    .categories-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: center;
      padding: 0.45rem 0.65rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    .cat-tab {
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 0.52rem 1.18rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      backdrop-filter: blur(12px);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cat-tab span {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      color: #ffffff;
    }
    .cat-tab:hover {
      border-color: var(--accent-1);
      color: #ffffff;
      background: color-mix(in srgb, var(--accent-1) 18%, transparent) !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--glow);
    }
    .cat-tab.active {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2)) !important;
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 26px var(--glow);
      transform: scale(1.04);
    }
    .cat-tab.active span {
      background: rgba(255, 255, 255, 0.24);
      color: #ffffff;
    }

    /* Main Container */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      perspective: 1400px;
    }

    .section-card-wrapper {
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2.25rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      margin-bottom: 2.25rem;
      transform-style: preserve-3d;
      transform: rotateX(8deg) translateY(30px) scale(0.97);
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.55s ease, border-color 0.3s ease, background 0.4s ease;
    }
    .section-card-wrapper:hover {
      border-color: var(--pill-border);
    }
    .section-card-wrapper.visible {
      transform: rotateX(0deg) translateY(0) scale(1);
      opacity: 1;
    }

    .banner-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 210px;
      background-size: cover;
      background-position: center;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      opacity: 0.52;
      filter: saturate(1.35) contrast(1.08);
    }

    /* Subtle Category Watermark Graphic */
    .category-watermark {
      position: absolute;
      top: 16px;
      right: 28px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 4.2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.035);
      pointer-events: none;
      user-select: none;
      z-index: 0;
      line-height: 1;
    }

    .section-header {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 1.1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .section-title-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .section-icon {
      font-size: 1.5rem;
      filter: drop-shadow(0 0 12px var(--glow));
    }
    .section-header h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-1));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .count-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      background: var(--pill-bg);
      color: var(--accent-1);
      border: 1px solid var(--pill-border);
      padding: 5px 13px;
      border-radius: 999px;
      box-shadow: 0 0 15px var(--glow);
    }

    /* Links Grid */
    .grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.35rem;
      padding-top: 0.5rem;
    }

    /* Centered Link Card with True 3D Parallax Pop & Glare */
    .link-card {
      position: relative;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 1.6rem 1.25rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: space-between;
      cursor: pointer;
      overflow: visible;
      transform-style: preserve-3d;
      transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle 150px at var(--mouse-x, 50%) var(--mouse-y, 50%), color-mix(in srgb, var(--accent-1) 24%, transparent), transparent 80%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      border-radius: 22px;
      z-index: 1;
    }

    .link-card:hover::before {
      opacity: 1;
    }

    .link-card::after {
      content: attr(data-url);
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%) translateY(8px) scale(0.92) translateZ(30px);
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.73rem;
      font-weight: 800;
      padding: 4px 13px;
      border-radius: 999px;
      pointer-events: none;
      box-shadow: 0 8px 25px var(--glow);
      opacity: 0;
      visibility: hidden;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      white-space: nowrap;
    }

    .link-card:hover::after {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1) translateZ(30px);
    }

    .link-card:hover {
      border-color: var(--accent-1);
      background: var(--card-hover);
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.55), 0 0 25px var(--glow);
      z-index: 5;
    }

    .card-top-row {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 26px;
      margin-bottom: -4px;
      transform: translateZ(16px);
    }

    .card-content-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      margin-top: 0.7rem;
      transform: translateZ(26px);
      transition: transform 0.3s ease;
    }

    .card-actions {
      display: flex;
      gap: 0.4rem;
    }
    .action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--muted);
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border-color: var(--accent-1);
      transform: scale(1.1);
    }
    .action-btn.fav-active {
      color: #ff2a85;
      border-color: rgba(255, 42, 133, 0.45);
      background: rgba(255, 42, 133, 0.15);
      box-shadow: 0 0 12px rgba(255, 42, 133, 0.35);
    }

    .favicon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .link-card:hover .favicon {
      transform: scale(1.08);
      box-shadow: 0 10px 24px var(--glow);
    }

    .site-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      letter-spacing: -0.01em;
    }

    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }
    .badge.trusted {
      background: color-mix(in srgb, var(--accent-3) 14%, transparent);
      color: var(--accent-3);
      border: 1px solid color-mix(in srgb, var(--accent-3) 35%, transparent);
    }
    .badge.new {
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Floating Top Button Dock */
    .floating-dock {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 999;
      display: flex;
      gap: 0.5rem;
    }
    .dock-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1.15rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dock-btn:hover {
      border-color: var(--accent-1);
      box-shadow: 0 0 20px var(--glow);
      transform: translateY(-3px);
    }

    /* Toast Popup */
    .toast {
      position: fixed;
      bottom: 1.75rem;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--card-hover);
      border: 1px solid var(--accent-1);
      color: #fff;
      padding: 0.65rem 1.4rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      backdrop-filter: blur(16px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 20px var(--glow);
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Footer DMCA */
    footer {
      max-width: 1200px;
      margin: 4.5rem auto 2rem;
      padding: 2.25rem 1.5rem 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .top-utility-bar {
        justify-content: center;
      }
      .categories-bar {

  <script>
    // --- Web Audio API Haptic Click Sound Generator with Auto-Unlock ---
    let audioCtx = null;
    function playClickSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(560, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(160, audioCtx.currentTime + 0.04);

        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    document.addEventListener('click', () => {
      if (audioCtx && audioCtx.state === 'suspended') {

    // Curated High-Res Online Photography Banners (Matching the Anime Unsplash Aesthetic)

    function openSite(domain) {
      playClickSound();

    }

    function copyLink(domain, event) {
      event.stopPropagation();
      playClickSound();
      const url = "https://" + domain;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).catch(() => fallbackCopy(url));
      } else {
        fallbackCopy(url);
      }
      showToast("Copied " + url + " 📋");
    }

    function fallbackCopy(text) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (e) {}
    }

    function toggleFav(domain, event) {
      event.stopPropagation();
      playClickSound();
      if (favorites.includes(domain)) {
        favorites = favorites.filter(d => d !== domain);
        showToast("Removed from Favorites");
      } else {
        favorites.push(domain);
        showToast("Saved to Favorites ❤️");

      try {

    const paletteMap = {

    function setTheme(themeName) {
      const validTheme = paletteMap[themeName] ? themeName : 'purple';
      document.body.setAttribute('data-theme', validTheme);
      try {
        localStorage.setItem('nexus_theme', validTheme);
      } catch (e) {}
      const colors = paletteMap[validTheme];

    function renderCategoriesBar() {
      categoriesBar.innerHTML = categoriesList.map(cat => {
        let count = 0;
        if (cat === "All") {
          count = sitesData.filter(s => s.countries.includes(activeCountry)).length;
        } else if (cat === "Favorites") {
          count = sitesData.filter(s => favorites.includes(s.domain)).length;
        } else {
          count = sitesData.filter(s => s.category === cat && s.countries.includes(activeCountry)).length;
        }
        return `
          <button class="cat-tab ${cat === activeCategory ? 'active' : ''}" onclick="playClickSound(); switchCategory('${cat}')">
            ${cat === 'Favorites' ? '❤️ ' : ''}${cat} <span>${count}</span>
          </button>
        `;
      }).join("");
    }

    function switchCategory(cat) {
      if (activeCategory === cat) return;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      activeCategory = cat;
      if (categoryConfig[cat]) {
        update3DPalette(categoryConfig[cat].color1, categoryConfig[cat].color2);
      }
      renderCategoriesBar();
      renderContent();
    }

    function renderContent() {
      let sectionsToRender = [];

      if (activeCategory === "All") {
        const subCategories = ["Movies & Shows", "Anime", "Manga", "Live TV & Sports", "Apps"];
        sectionsToRender = subCategories.map(subCat => ({
          name: subCat,
          banner: categoryConfig[subCat].banner,
          icon: categoryConfig[subCat].icon,

      } else if (activeCategory === "Favorites") {

        }];
      } else {
        const catSites = sitesData.filter(s => s.category === activeCategory && s.countries.includes(activeCountry));

    // --- 3D Card Parabolic Tilt & Interactive Mouse Glow Effect ---
    function handleCardTilt(e, card) {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      card.style.setProperty('--mouse-x', `${x}px`);
      card.style.setProperty('--mouse-y', `${y}px`);

      const xc = rect.width / 2;
      const yc = rect.height / 2;

      const dx = x - xc;
      const dy = y - yc;

      const maxAngle = 13;
      const rotateX = (-dy / yc) * maxAngle;
      const rotateY = (dx / xc) * maxAngle;

      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px) scale(1.02)`;
    }

    function resetCardTilt(card) {
      card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px) scale(1)`;
    }

    // --- Three.js Interactive 3D Movies, Anime & Manga Models Background ---

    let primaryWireMat, secondaryWireMat, particleMat;

    function makeCanvasTexture(drawFn, w = 256, h = 256) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      drawFn(ctx, w, h);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    // 1. MOVIE CLAPPERBOARD 3D MODEL
    function createClapperboardModel(accentMat, secondaryMat) {
      const group = new THREE.Group();
      const slateTex = makeCanvasTexture((ctx, w, h) => {
        ctx.fillStyle = '#0b0e1a';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.strokeRect(10, 10, w - 20, h - 20);
        ctx.fillStyle = '#c084fc';
        ctx.font = 'bold 24px monospace';
        ctx.fillText('NEXUS // SCENE 01', 22, 55);
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(20, 80); ctx.lineTo(w - 20, 80);
        ctx.moveTo(20, 135); ctx.lineTo(w - 20, 135);
        ctx.moveTo(128, 80); ctx.lineTo(128, 190);
        ctx.stroke();
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('TAKE: 4K', 24, 115);
        ctx.fillText('FPS: 60', 142, 115);
      }, 256, 200);

      const slateMat = new THREE.MeshStandardMaterial({ map: slateTex, roughness: 0.35, metalness: 0.3 });
      const slateGeo = new THREE.BoxGeometry(3.8, 2.7, 0.28);
      const slateMesh = new THREE.Mesh(slateGeo, slateMat);
      group.add(slateMesh);

      const slateEdges = new THREE.LineSegments(new THREE.EdgesGeometry(slateGeo), accentMat);
      group.add(slateEdges);

      const stripeTex = makeCanvasTexture((ctx, w, h) => {
        ctx.fillStyle = '#090b14';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#f8fafc';
        for (let i = -h; i < w; i += 48) {
          ctx.beginPath();
          ctx.moveTo(i, h);
          ctx.lineTo(i + 24, h);
          ctx.lineTo(i + 24 + h, 0);
          ctx.lineTo(i + h, 0);
          ctx.closePath();
          ctx.fill();
        }
      }, 256, 64);

      const barMat = new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.3 });
      const bottomBar = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.42, 0.3), barMat);
      bottomBar.position.set(0, 1.56, 0);
      group.add(bottomBar);

      const topBarPivot = new THREE.Group();
      topBarPivot.position.set(-1.9, 1.78, 0);
      const topBar = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.42, 0.3), barMat);
      topBar.position.set(1.9, 0.21, 0);
      topBarPivot.add(topBar);
      topBarPivot.rotation.z = 0.28;
      group.add(topBarPivot);

      group.userData.category = "Movies & Shows";
      return group;
    }

    // 2. 3D CINEMA FILM REEL MODEL
    function createFilmReelModel(accentMat, secondaryMat) {
      const group = new THREE.Group();
      const metalMat = new THREE.MeshStandardMaterial({ color: 0x1e243b, metalness: 0.75, roughness: 0.25 });

      const rimGeo = new THREE.TorusGeometry(2.1, 0.14, 12, 40);
      const topRim = new THREE.Mesh(rimGeo, accentMat);
      topRim.position.z = 0.25;
      const botRim = new THREE.Mesh(rimGeo, accentMat);
      botRim.position.z = -0.25;
      group.add(topRim, botRim);

      const coreGeo = new THREE.CylinderGeometry(1.85, 1.85, 0.42, 32);
      coreGeo.rotateX(Math.PI / 2);
      const core = new THREE.Mesh(coreGeo, metalMat);
      group.add(core);

      const hubGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.56, 20);
      hubGeo.rotateX(Math.PI / 2);
      const hub = new THREE.Mesh(hubGeo, secondaryMat);
      group.add(hub);

      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.9, 0.52), accentMat);
        spoke.position.set(Math.cos(angle) * 1.0, Math.sin(angle) * 1.0, 0);
        spoke.rotation.z = angle + Math.PI / 2;
        group.add(spoke);
      }

      group.userData.category = "Movies & Shows";
      return group;
    }

    // 3. 3D POPCORN BUCKET MODEL
    function createPopcornModel(accentMat) {
      const group = new THREE.Group();
      const stripeTex = makeCanvasTexture((ctx, w, h) => {
        ctx.fillStyle = '#fff5f5';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#f43f5e';
        for (let x = 0; x < w; x += 32) {
          ctx.fillRect(x, 0, 16, h);
        }
        ctx.fillStyle = '#090b14';
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, 54, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('POPCORN', w / 2, h / 2 + 8);
      }, 256, 256);

      const tubGeo = new THREE.CylinderGeometry(1.45, 1.0, 2.7, 24, 1, false);
      const tubMat = new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.4 });
      const tub = new THREE.Mesh(tubGeo, tubMat);
      group.add(tub);

      const rim = new THREE.Mesh(new THREE.TorusGeometry(1.46, 0.08, 10, 32), accentMat);
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 1.35;
      group.add(rim);

      const puffMat = new THREE.MeshStandardMaterial({
        color: 0xfde047,
        emissive: 0xca8a04,
        emissiveIntensity: 0.25,
        roughness: 0.5
      });
      const puffPositions = [
        [0, 1.55, 0, 0.65],
        [-0.65, 1.48, 0.4, 0.52],
        [0.65, 1.5, 0.35, 0.54],
        [-0.5, 1.52, -0.55, 0.5],
        [0.55, 1.48, -0.5, 0.52],
        [0, 1.55, 0.72, 0.46],
        [0, 1.52, -0.72, 0.46],
        [-0.85, 1.4, -0.1, 0.44],
        [0.85, 1.42, -0.05, 0.45]
      ];
      puffPositions.forEach(([px, py, pz, r]) => {
        const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 1), puffMat);
        puff.position.set(px, py, pz);
        puff.rotation.set(px, py, pz);
        group.add(puff);
      });

      group.userData.category = "Movies & Shows";
      return group;
    }

    // 4. 3D ANIME KATANA SWORD + SLASH AURA
    function createKatanaModel(accentMat, secondaryMat) {
      const group = new THREE.Group();
      const bladeGeo = new THREE.BoxGeometry(0.18, 5.4, 0.06);
      const bladeMat = new THREE.MeshStandardMaterial({
        color: 0xf8fafc,
        emissive: 0x38bdf8,
        emissiveIntensity: 0.4,
        metalness: 0.9,
        roughness: 0.1
      });
      const blade = new THREE.Mesh(bladeGeo, bladeMat);
      blade.position.y = 1.2;
      group.add(blade);

      const tsubaGeo = new THREE.CylinderGeometry(0.65, 0.65, 0.12, 8);
      const tsubaMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.8, roughness: 0.2 });
      const tsuba = new THREE.Mesh(tsubaGeo, tsubaMat);
      tsuba.position.y = -1.5;
      group.add(tsuba);

      const handleGeo = new THREE.CylinderGeometry(0.16, 0.16, 1.9, 12);
      const handleMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.6 });
      const handle = new THREE.Mesh(handleGeo, handleMat);
      handle.position.y = -2.5;
      group.add(handle);

      for (let i = 0; i < 5; i++) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.04, 8, 16), secondaryMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -1.8 - i * 0.34;

    // 8. 3D ANIME SHURIKEN STAR
    function createShurikenModel(accentMat, secondaryMat) {
      const group = new THREE.Group();
      const starShape = new THREE.Shape();
      const outerR = 2.0;
      const innerR = 0.56;
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const r = i % 2 === 0 ? outerR : innerR;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) starShape.moveTo(x, y);
        else starShape.lineTo(x, y);
      }
      starShape.closePath();

      const holePath = new THREE.Path();
      holePath.absarc(0, 0, 0.32, 0, Math.PI * 2, false);
      starShape.holes.push(holePath);

      const extrudeGeo = new THREE.ExtrudeGeometry(starShape, {
        depth: 0.16,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.06,
        bevelThickness: 0.06
      });
      extrudeGeo.center();

      const bladeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.85, roughness: 0.2 });
      const starMesh = new THREE.Mesh(extrudeGeo, bladeMat);
      group.add(starMesh);

      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.06, 10, 24), secondaryMat);
      group.add(ring);

      group.userData.category = "Anime";
      return group;
    }

    function init3DBackground() {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas || typeof THREE === 'undefined') return;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 26;

      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      pointLight1 = new THREE.PointLight(0xc084fc, 1.9, 85);
      pointLight1.position.set(-18, 14, 15);
      scene.add(pointLight1);

      pointLight2 = new THREE.PointLight(0xa855f7, 1.7, 85);
      pointLight2.position.set(18, -12, 15);
      scene.add(pointLight2);

      shapesGroup = new THREE.Group();
      scene.add(shapesGroup);

      primaryWireMat = new THREE.MeshStandardMaterial({
        color: 0xc084fc,
        emissive: 0xc084fc,
        emissiveIntensity: 0.45,
        roughness: 0.25,
        metalness: 0.6
      });

      secondaryWireMat = new THREE.MeshStandardMaterial({
        color: 0xa855f7,
        emissive: 0xa855f7,
        emissiveIntensity: 0.45,
        roughness: 0.25,
        metalness: 0.6
      });

      const models = [
        { mesh: createClapperboardModel(primaryWireMat, secondaryWireMat), pos: [-16.5, 8.5, -7], scale: 1.0 },
        { mesh: createMangaBookModel(primaryWireMat), pos: [16.5, 8.2, -8], scale: 1.1 },
        { mesh: createKatanaModel(primaryWireMat, secondaryWireMat), pos: [-15.8, -7.8, -6], scale: 1.0 },
        { mesh: createToriiGateModel(primaryWireMat), pos: [16.2, -8.2, -8], scale: 1.0 },
        { mesh: createFilmReelModel(primaryWireMat, secondaryWireMat), pos: [-8.5, 11.8, -13], scale: 0.95 },
        { mesh: createPopcornModel(primaryWireMat), pos: [8.5, -11.5, -11], scale: 0.95 },
        { mesh: createStreamingTVModel(primaryWireMat, secondaryWireMat), pos: [20.5, 0.5, -12], scale: 0.9 },
        { mesh: createShurikenModel(primaryWireMat, secondaryWireMat), pos: [-20.5, 1.2, -11], scale: 0.9 },
        { mesh: createDragonOrbModel(primaryWireMat, secondaryWireMat), pos: [0, 12.8, -14], scale: 0.95 },
        { mesh: createCinemaGlassesModel(primaryWireMat), pos: [-1.5, -12.5, -13], scale: 0.95 },
        { mesh: createKunaiModel(primaryWireMat, secondaryWireMat), pos: [9.5, 12.2, -14], scale: 0.9 },
        { mesh: createHeadphonesModel(primaryWireMat, secondaryWireMat), pos: [-9.8, -11.8, -13], scale: 0.9 },
        { mesh: createControllerModel(primaryWireMat, secondaryWireMat), pos: [21.0, -5.8, -14], scale: 0.88 },
        { mesh: createMangaBubbleModel(primaryWireMat), pos: [-21.0, -5.2, -13], scale: 0.88 }
      ];

      models.forEach((item, idx) => {
        const obj = item.mesh;
        obj.position.set(item.pos[0], item.pos[1], item.pos[2]);
        obj.scale.setScalar(item.scale);
        obj.userData = {
          ...obj.userData,
          baseScale: item.scale,
          targetScale: item.scale,
          rotSpeedX: (idx % 2 === 0 ? 1 : -1) * 0.0032,
          rotSpeedY: (idx % 3 === 0 ? 1 : -1) * 0.0055,
          floatSpeed: 0.0012 + (idx * 0.00015),
          floatOffset: idx * 0.9,
          baseY: item.pos[1]
        };
        shapesGroup.add(obj);
      });

      const particleCount = 240;
      const posArray = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 75;
        posArray[i + 1] = (Math.random() - 0.5) * 55;
        posArray[i + 2] = (Math.random() - 0.5) * 35 - 5;
      }
      const particlesGeo = new THREE.BufferGeometry();
      particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      particleMat = new THREE.PointsMaterial({
        size: 0.16,
        color: 0xe879f9,
        transparent: true,
        opacity: 0.55
      });
      particlesMesh = new THREE.Points(particlesGeo, particleMat);
      scene.add(particlesMesh);

      // Sync 3D colors with current saved theme on load
      const activeTheme = document.body.getAttribute('data-theme') || 'purple';
      if (paletteMap[activeTheme]) {
        update3DPalette(paletteMap[activeTheme][0], paletteMap[activeTheme][1], paletteMap[activeTheme][2]);
      }

      window.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetMouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
      });

      window.addEventListener('resize', () => {
        if (!camera || !renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate3D();
    }

    function update3DPalette(hex1, hex2, hex3) {
      if (primaryWireMat && secondaryWireMat) {
        primaryWireMat.color.setHex(hex1);
        primaryWireMat.emissive.setHex(hex1);
        secondaryWireMat.color.setHex(hex2);
        secondaryWireMat.emissive.setHex(hex2);
      }
      if (pointLight1 && pointLight2) {
        pointLight1.color.setHex(hex1);
        pointLight2.color.setHex(hex2);
      }
      if (particleMat && hex3) {
        particleMat.color.setHex(hex3);
      }
      if (shapesGroup) {
        shapesGroup.children.forEach((obj) => {
          if (activeCategory === "All" || activeCategory === "Favorites") {
            obj.userData.targetScale = obj.userData.baseScale;
          } else if (obj.userData.category === activeCategory) {
            obj.userData.targetScale = obj.userData.baseScale * 1.35;
          } else {
            obj.userData.targetScale = obj.userData.baseScale * 0.62;
          }
        });
      }
    }

    function animate3D() {
      if (!is3DRunning) return;
      animFrameId = requestAnimationFrame(animate3D);

      const time = performance.now();
      currentMouseX += (targetMouseX - currentMouseX) * 0.05;
      currentMouseY += (targetMouseY - currentMouseY) * 0.05;

      if (shapesGroup) {
        shapesGroup.rotation.y = currentMouseX * 0.22;
        shapesGroup.rotation.x = currentMouseY * 0.15;

        shapesGroup.children.forEach((mesh) => {
          mesh.rotation.x += mesh.userData.rotSpeedX;
          mesh.rotation.y += mesh.userData.rotSpeedY;
          mesh.position.y = mesh.userData.baseY + Math.sin(time * mesh.userData.floatSpeed + mesh.userData.floatOffset) * 1.35;
          const currentS = mesh.scale.x;
          const targetS = mesh.userData.targetScale || mesh.userData.baseScale;
          mesh.scale.setScalar(currentS + (targetS - currentS) * 0.06);
        });
      }

      if (particlesMesh) {
        particlesMesh.rotation.y = time * 0.00008 + currentMouseX * 0.1;
        particlesMesh.rotation.x = currentMouseY * 0.08;
      }

      renderer.render(scene, camera);
    }

    function toggle3DMotion() {
      is3DRunning = !is3DRunning;
      const btn = document.getElementById('toggle-3d-btn');
      if (btn) btn.textContent = is3DRunning ? '✦ 3D: ON' : '✦ 3D: PAUSED';
      if (is3DRunning) {
        if (animFrameId) cancelAnimationFrame(animFrameId);
        animate3D();
      } else if (animFrameId) {
        cancelAnimationFrame(animFrameId);
      }
    }

    // Restore saved theme if present
    try {
      const savedTheme = localStorage.getItem('nexus_theme');
      const validTheme = paletteMap[savedTheme] ? savedTheme : 'purple';
      document.body.setAttribute('data-theme', validTheme);
      const ts = document.getElementById('theme-select');
      if (ts) ts.value = validTheme;
    } catch (e) {}

    // Initial render
    renderCategoriesBar();
    renderContent();
    window.addEventListener('load', init3DBackground);
  </script>
</body>
</html>
